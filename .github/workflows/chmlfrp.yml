name: ChmlFrp VNC 远程桌面
on:
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: windows-latest
    steps:
      - name: 开启远程桌面与防火墙规则
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      
      - name: 安装 RealVNC Server 服务端
        run: |
          Invoke-WebRequest -Uri "https://downloads.realvnc.com/download/file/vnc.files/VNC-Server-Windows.exe" -OutFile "$env:TEMP\vnc-server.exe"
          Start-Process -FilePath "$env:TEMP\vnc-server.exe" -ArgumentList "/verysilent", "/norestart" -Wait
          & "C:\Program Files\RealVNC\VNC Server\vncserver.exe" -service -password "Vnc123456"

      - name: 下载 ChmlFrp Windows 客户端
        run: |
          Invoke-WebRequest -Uri "https://chmlfrp.cn/download/chmlfrp-windows-amd64.exe" -OutFile "C:\chmlfrp.exe"
      
      - name: 生成 ChmlFrp 配置文件
        run: |
          "serverAddr = `"hn.frp.one`"" | Out-File C:\frpc.toml -Encoding utf8
          "serverPort = 7005" | Out-File C:\frpc.toml -Append -Encoding utf8
          "user = `"$env:CHML_USER_ID`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "dnsServer = `"223.6.6.6`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "" | Out-File C:\frpc.toml -Append -Encoding utf8
          "[auth]" | Out-File C:\frpc.toml -Append -Encoding utf8
          "method = `"token`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "token = `"ChmlFrpToken`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "" | Out-File C:\frpc.toml -Append -Encoding utf8
          "[transport]" | Out-File C:\frpc.toml -Append -Encoding utf8
          "tcpMux = true" | Out-File C:\frpc.toml -Append -Encoding utf8
          "protocol = `"tcp`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "tls.enable = false" | Out-File C:\frpc.toml -Append -Encoding utf8
          "" | Out-File C:\frpc.toml -Append -Encoding utf8
          "[[proxies]]" | Out-File C:\frpc.toml -Append -Encoding utf8
          "name = `"GitHub1`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "type = `"tcp`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "localIP = `"127.0.0.1`"" | Out-File C:\frpc.toml -Append -Encoding utf8
          "localPort = 5900" | Out-File C:\frpc.toml -Append -Encoding utf8
          "remotePort = 40421" | Out-File C:\frpc.toml -Append -Encoding utf8
          "" | Out-File C:\frpc.toml -Append -Encoding utf8
          "[proxies.transport]" | Out-File C:\frpc.toml -Append -Encoding utf8
          "useEncryption = true" | Out-File C:\frpc.toml -Append -Encoding utf8
          "useCompression = true" | Out-File C:\frpc.toml -Append -Encoding utf8
        env:
          CHML_USER_ID: ${{ secrets.CHML_USER_ID }}
      
      - name: 启动 ChmlFrp 穿透隧道
        run: Start-Process -FilePath "C:\chmlfrp.exe" -ArgumentList "-c C:\frpc.toml"
      
      - name: 保持虚拟机运行6小时
        run: for ($i=0; $i -lt 360; $i++) { Write-Host "会话存活中：第 $i 分钟"; Start-Sleep -Seconds 60 }
