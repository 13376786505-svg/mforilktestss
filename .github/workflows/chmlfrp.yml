name: ChmlFrp VNC 远程桌面

on:
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: windows-latest

    steps:
      - name: 开启远程桌面
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

      - name: 安装 TightVNC 服务端并开启回环访问
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP 'tightvnc.msi'
          Invoke-WebRequest -Uri 'https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi' -OutFile $msi
          $installArgs = @(
            '/i',
            $msi,
            '/quiet',
            '/norestart',
            'ADDLOCAL=Server',
            'SET_USECONTROLAUTHENTICATION=0',
            'SET_PASSWORD=Vnc123456',
            'SET_ACCEPT_LOOPBACK_CONNECTIONS=1',
            'SET_LOOPBACK_ONLY=0'
          )
          Start-Process -FilePath 'msiexec.exe' -ArgumentList $installArgs -Wait
          Start-Sleep -Seconds 5
          # 验证服务监听状态
          Get-NetTCPConnection -LocalPort 5900 -ErrorAction Stop


      - name: 下载并解压 ChmlFrp 0.70.1
        shell: pwsh
        run: |
          $zip = 'C:\chmlfrp.zip'
          $dir = 'C:\chmlfrp'
          Invoke-WebRequest -Uri 'https://cf-v1.uapis.cn/download/ChmlFrp-0.70.1_261101_windows_amd64.zip' -OutFile $zip
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Get-ChildItem -Path $dir -Recurse -File | Select-Object FullName, Length

      - name: 生成 ChmlFrp 配置文件
        shell: pwsh
        env:
          CHML_USER_ID: ${{ secrets.CHML_USER_ID }}
        run: |
          $lines = @(
            'serverAddr = "hn.frp.one"',
            'serverPort = 7005',
            "user = `"$env:CHML_USER_ID`"",
            'dnsServer = "223.6.6.6"',
            '',
            '[auth]',
            'method = "token"',
            'token = "ChmlFrpToken"',
            '',
            '[transport]',
            'tcpMux = true',
            'protocol = "tcp"',
            'tls.enable = false',
            '',
            '[[proxies]]',
            'name = "GitHub1"',
            'type = "tcp"',
            'localIP = "127.0.0.1"',
            'localPort = 5900',
            'remotePort = 40421',
            '',
            '[proxies.transport]',
            'useEncryption = true',
            'useCompression = true'
          )
          $lines | Set-Content -Path 'C:\frpc.toml' -Encoding UTF8
          Get-Content 'C:\frpc.toml'

      - name: 启动桌面进程
        shell: pwsh
        run: |
          Start-Process explorer.exe -ErrorAction SilentlyContinue

      - name: 启动 ChmlFrp 隧道
        shell: pwsh
        run: |
          $frpc = Get-ChildItem -Path 'C:\chmlfrp' -Recurse -File -Include '*.exe' | Select-Object -First 1
          if ($null -eq $frpc) {
            throw '解压目录中没有找到 ChmlFrp 可执行文件'
          }
          Write-Host "ChmlFrp 路径：$($frpc.FullName)"
          Start-Process -FilePath $frpc.FullName -ArgumentList '-c C:\frpc.toml'
          Start-Sleep -Seconds 10
          Get-NetTCPConnection -LocalPort 5900 -ErrorAction SilentlyContinue

      - name: 保持虚拟机运行6小时
        shell: pwsh
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Write-Host "会话存活中：第 $i 分钟"
            Start-Sleep -Seconds 60
          }
